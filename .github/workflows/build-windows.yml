name: Build Windows exe

# Runs when a version tag (v1.0.0 ...) is pushed and publishes a GitHub Release with
# idle-progress.exe. You can also start it by hand from the Actions tab to just build and test.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller windows-curses

      - name: Build the exe
        run: pyinstaller --onefile --name idle-progress --paths src src/menu.py

      - name: Self-test the exe
        run: |
          $out = .\dist\idle-progress.exe --selftest
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or $out -notmatch "selftest ok") { throw "selftest failed" }

      - uses: actions/upload-artifact@v7
        with:
          name: idle-progress-windows
          path: dist/idle-progress.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/idle-progress.exe
          --title "Idle Progress ${{ github.ref_name }}"
          --notes "Windows build. Put idle-progress.exe in its own folder and run it (Windows Terminal recommended). Saves are stored in a saves folder next to the exe. Made with AI, see the README."
